<!DOCTYPE html>
<head>
  <title>Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="css/log-register/log.css">
</head>

<body>
  <div class="container">

      <div class="wrap-log-reg">

        <div class="left">
          <img src="images/log-reg.jpg">
        </div>

        <div class="right">
          <div class="top">
            <a href="index.html"><img src="icons/back.png"></a>
            <a href="login.html"><p class="log-in">Log In</p></a>
            <a href="register.html"><p class="reg">Register</p></a>
          </div>

          <div class="middle">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
              <label>Password</label>
              <input type="password" placeholder="••••••••">
              <div class="forgot">
                <a href="#">Forgot your password?</a>
              </div>
            </div>
          </div>

          <div class="log-in-btn"> 
            <button>
              <span>Log In</span>
            </button>
          </div>
        </div>





      </div>
</body>
</html>
