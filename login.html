<!DOCTYPE html>
<head>
  <title>Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="css/log-register/log.css">
</head>

<body>
  <div class="container">
    <div class="inside-container">
      <p class="login">Login</p>

      <div class="email-box">
        <label for="" class="label">Email</label>
        <input type="text" class="type-box" placeholder="Enter email">
      </div>

      <div class="password-box">
        <label for="" class="label">Password</label>
        <input type="password" class="type-box" placeholder="Enter password">
        <a href="#">Forgot password?</a>
      </div>

      <div class="submit">
        <button class="sign-in">Sign In</button>
        <p class="reg-label">Not a member? <a href="register.html" class="reg-href">Register here</a></p>
      </div>
    </div>
  </div>
</body>
</html>
