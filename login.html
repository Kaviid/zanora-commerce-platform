<!DOCTYPE html>
<head>
  <title>Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="css/log-register/log.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
  <div class="container">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <form action="backend/auth/login.php" method="POST">
      <div class="inside-container">
        <p class="login">Login</p>
  
        <div class="email-box">
          <label for="" class="label">Email</label>
          <input type="text" name="email" class="type-box" placeholder="Enter email">
        </div>
  
        <div class="password-box">
          <label for="" class="label">Password</label>
          <input type="password" name="password" class="type-box" placeholder="Enter password">
          <a href="#">Forgot password?</a>
        </div>
  
        <div class="submit">
          <button class="sign-in">Sign In</button>
          <p class="reg-label">Not a member? <a href="register.html" class="reg-href">Register here</a></p>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
