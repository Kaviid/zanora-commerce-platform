<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Functions</title>
  </head>
  <body>

    <div class="top-btn">
      <button onclick="
          console.log(`Cart quantity : ${cartQuantity}`)
        ">Show Quantity</button>

      <button onclick="
        cartQuantity += 1;
        console.log('Added 1 item...')
      ">Add to Cart</button>

      <button onclick="
        cartQuantity += 2;
        console.log('Added 2 item...')
      ">+2</button>

      <button onclick="
        cartQuantity += 3;
        console.log('Added 3 item...')
      ">+3</button>

      <button onclick="
        cartQuantity = 0;
        console.log('Cart was Reset!')
      ">Reset Cart</button>
    </div>

    <!-------------------------------------------------------------------------->

    <div class="bottom-btn" style="margin-top: 50px;">
      <button onclick="
          itemsQuantity += 1;
          console.log('Added Item to Cart...')
        ">Add to Cart</button>

      <button onclick="
        itemsQuantity += 1;
        console.log('Increase by 1')
      ">+</button>

      <button onclick="decrease_item()">-</button>

      <button onclick="
        itemsQuantity = 0;
        console.log('Deleted al items...')
      ">Delete Items</button>

      <button onclick="
        console.log(`Item Quantity : ${itemsQuantity}`)
      ">Show Quantity</button>


    </div>

    <script>
      let cartQuantity = 0;
      let itemsQuantity = 0;

      function decrease_item(){
        if (itemsQuantity >= 2) {
          itemsQuantity -= 1;
          console.log('Decrease by 1')
        }
      }

    </script>
  </body>
</html>
