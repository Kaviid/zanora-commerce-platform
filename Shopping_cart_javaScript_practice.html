<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Functions</title>
    <style>
      
      button{
        background-color: rgb(253, 144, 70);
        color: white;
        border: none;
        padding: 15px 20px ;
        font-size: medium;
        border-radius: 50px;
        margin-right: 15px;
        cursor: pointer;
      }
      button:hover{
      background-color: rgb(255, 119, 28);
      }

    </style>
  </head>
  <body>
    <div class="bottom-btn" style="margin-top: 50px;">
      <button onclick="
          itemsQuantity += 1;
          console.log('Added Item to Cart...')
        ">Add to Cart</button>

      <button onclick="
        itemsQuantity += 1;
        console.log('Increase by 1')
      ">+</button>

      <button onclick="decrease_item()">-</button>

      <button onclick="
        itemsQuantity = 0;
        console.log('Deleted al items...')
      ">Delete Items</button>

      <button onclick="
        console.log(`Item Quantity : ${itemsQuantity}`)
      ">Show Quantity</button>
    </div>

    <script>
      let itemsQuantity = 0;

      function decrease_item(){
        if (itemsQuantity >= 2) {
          itemsQuantity -= 1;
          console.log('Decrease by 1')
        }
      }

    </script>
  </body>
</html>
